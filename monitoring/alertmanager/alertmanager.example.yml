# Alertmanager — deploy with real secrets (do not commit).
# Switch `route.receiver` from `noop` to `telegram` or `email` after filling receivers.

global:
  resolve_timeout: 5m

route:
  receiver: 'noop'
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 10m
  routes:
    - matchers:
        - severity = critical
      group_wait: 10s
      continue: true
    - matchers:
        - severity = warning
      group_interval: 10m
      repeat_interval: 30m

receivers:
  - name: 'noop'
    webhook_configs:
      - url: 'http://127.0.0.1:9/drop'
        send_resolved: false

  # Uncomment and use after `route.receiver: telegram`
  - name: 'telegram'
    telegram_configs:
      - bot_token: 'REPLACE_FROM_BOTFATHER'
        chat_id: 'REPLACE_NUMERIC_CHAT_ID'
        parse_mode: 'HTML'

  - name: 'email'
    email_configs:
      - to: 'oncall@example.com'
        from: 'alertmanager@example.com'
        smarthost: 'smtp.example.com:587'
        auth_username: 'alertmanager@example.com'
        auth_password: 'REPLACE_SMTP_PASSWORD'
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['alertname', 'instance', 'job']
