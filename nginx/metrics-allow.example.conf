# Include from `location = /metrics { ... }` in nginx. Last line must be `deny all;` after allows.
# Replace with your VPC (private) CIDRs and the Prometheus / VPN exit IP that should scrape the API.

# Private ranges (tighten to your cloud VPC, e.g. 10.48.0.0/16)
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;

# Single host: Prometheus on a fixed droplet (example)
# allow 203.0.113.50;

# Loopback (optional: only if you terminate TLS and scrape from same host)
# allow 127.0.0.1;

deny all;
