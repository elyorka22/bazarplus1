# Example: protect /metrics with HTTP Basic when IP allowlists are impractical (fallback).
# Generate hash: `openssl passwd -apr1` then:
#   htpasswd -cb /etc/nginx/.metrics_htpasswd prom_user STRONG_PASSWORD
#
# In server { ... }:
#
# location = /metrics {
#     auth_basic           "Metrics";
#     auth_basic_user_file /etc/nginx/.metrics_htpasswd;
#     proxy_pass           http://bazarplus_api;
#     proxy_http_version   1.1;
#     proxy_set_header     Host $host;
#     proxy_set_header     X-Real-IP $remote_addr;
# }
#
# Configure Prometheus with basic_auth in scrape_config.
