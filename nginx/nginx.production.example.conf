# Example: terminate TLS on the Droplet with Let's Encrypt (certbot) and proxy to Docker `api:3000`.
# Copy to the server as e.g. /etc/nginx/sites-enabled/api.conf and adjust paths + server_name.
#
# DNS:
#   api.domain.com  A → Droplet IP
#
# Certbot (Debian/Ubuntu):
#   sudo certbot certonly --nginx -d api.domain.com
#   # or: certbot certonly --standalone -d api.domain.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream bazarplus_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name api.domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.domain.com;

    ssl_certificate     /etc/letsencrypt/live/api.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.domain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # --- Metrics (Prometheus) — never expose without restriction ---
    # Replace PROMETHEUS_IP / VPC CIDRs in nginx/metrics-allow.example.conf or inline `allow` rules.
    # Option B: omit this block and scrape the API only on a private listener (see docs/OBSERVABILITY.md).
    # Option C: `satisfy any; allow ...; auth_basic ...` for operator fallback.
    #
    # include /etc/nginx/snippets/bazarplus-metrics-allow.conf;
    # location = /metrics {
    #     include /etc/nginx/snippets/bazarplus-metrics-allow.conf;
    #     deny all;
    #     proxy_pass http://bazarplus_api;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        proxy_pass http://bazarplus_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Socket.IO (path /socket.io; namespace /tracking is negotiated in-frame)
    location /socket.io/ {
        proxy_pass http://bazarplus_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
